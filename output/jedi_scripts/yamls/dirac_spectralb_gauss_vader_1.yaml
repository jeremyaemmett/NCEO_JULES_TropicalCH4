# met office covariance on gaussian mesh without super saber blocks
# should give same dirac test results as dirac_spectralb_gauss_vader_2
geometry:
  function space: StructuredColumns  # Structured grids
  grid:
    type: regular_gaussian  # Regular Gaussian grid
    N: 12                   # Resolution
  groups:
  - variables:  # Group 1: variables on 70 model levels
    - air_horizontal_streamfunction
    - air_horizontal_velocity_potential  
    - air_potential_temperature  
    - air_pressure  
    - air_pressure_levels_minus_one  # Pressure at mid-levels (layer centers)
    - air_temperature  
    - cfeff  
    - cleff 
    - cloud_liquid_water_mixing_ratio_wrt_dry_air
    - cloud_liquid_water_mixing_ratio_wrt_moist_air_and_condensed_water
    - cloud_ice_mixing_ratio_wrt_dry_air
    - cloud_ice_mixing_ratio_wrt_moist_air_and_condensed_water
    - dlsvpdT  # Log derivative of saturation vapor pressure from temperature
    - dimensionless_exner_function  # Non-dimensional pressure
    - dimensionless_exner_function_levels_minus_one  # Non-dimensional pressure on mid-levels
    - dry_air_density_levels_minus_one  # Dry air density at mid-levels
    - eastward_wind  # Zonal (u-component) wind
    - geostrophic_pressure_levels_minus_one  # Geostrophically balanced pressure (mid-levels)
    - height_above_mean_sea_level  # Geopotential height
    - ice_cloud_volume_fraction_in_atmosphere_layer
    - liquid_cloud_volume_fraction_in_atmosphere_layer
    - mu
    - muA
    - muH1
    - muRecipDeterminant
    - muRow1Column1
    - muRow1Column2
    - muRow2Column1
    - muRow2Column2
    - northward_wind  # Meridional (v-component) wind
    - qrain  # Rain water content
    - qsat  # Saturation specific humidity
    - qt  # Total specific humidity
    - rain_mixing_ratio_wrt_dry_air
    - rht  # Relative humidity temperature
    - svp  # Saturation vapor pressure
    - total_water_mixing_ratio_wrt_dry_air
    - unbalanced_pressure_levels_minus_one
    - virtual_potential_temperature
    - water_vapor_mixing_ratio_wrt_dry_air
    - water_vapor_mixing_ratio_wrt_moist_air_and_condensed_water
    levels: 70
  - variables:  # Group 2: variables on 71 levels (e.g. level edges)
    - air_pressure_levels
    - height_above_mean_sea_level_levels
    - hydrostatic_exner_levels
    - hydrostatic_pressure_levels
    levels: 71
  partitioner: ectrans  # Partitioning method for MPI distribution
  halo: 1  # Halo width for domain decomposition for parallel computation

increment variables:  # Variables for which increments are computed in assimilation
- air_potential_temperature
- cloud_ice_mixing_ratio_wrt_moist_air_and_condensed_water
- cloud_liquid_water_mixing_ratio_wrt_moist_air_and_condensed_water
- dimensionless_exner_function_levels_minus_one
- dry_air_density_levels_minus_one
- eastward_wind
- northward_wind
- water_vapor_mixing_ratio_wrt_moist_air_and_condensed_water

background error:
  covariance model: SABER  # Use SABER model for error covariances
  adjoint test: true
  inverse test: true
  # Small tolerances to illustrate local overriding in saber blocks:
  adjoint tolerance: 1e-12
  inverse tolerance: 1e-13
  saber central block:
    saber block name: spectral covariance  # Central block with spectral covariances
    active variables:
    - air_horizontal_streamfunction
    - air_horizontal_velocity_potential
    - mu
    - unbalanced_pressure_levels_minus_one
    read:
      covariance_file: testdata/spectralcov.nc
      umatrix_netcdf_names:
      - PSI_inc_Uv_matrix
      - CHI_inc_Uv_matrix
      - MU_inc_Uv_matrix 
      - aP_inc_Uv_matrix
  saber outer blocks:
  - saber block name: spectral to gauss
    active variables:
    - air_horizontal_streamfunction
    - air_horizontal_velocity_potential
    - eastward_wind
    - mu
    - northward_wind
    - unbalanced_pressure_levels_minus_one
  - saber block name: gauss winds to geostrophic pressure
    skip inverse test: true  # Tested within mo_hydrostatic_pressure block
  - saber block name: mo_hydrostatic_pressure_from_geostrophic_pressure
    skip inverse test: true  # Tested within mo_hydrostatic_pressure block
    read:
      covariance file path: testdata/FPstats.nc
      number of covariance latitude rings: 481
      gp regression bins: 18
  - saber block name: mo_hydrostatic_pressure_to_hydrostatic_exner
  - saber block name: mo_hydro_bal
    inner variables to compare: [hydrostatic_exner_levels]
    outer variables to compare: [virtual_potential_temperature, air_pressure_levels]
  - saber block name: mo_moisture_control
    adjoint tolerance: 2e-12
    inner variables to compare:
      - mu
      - virtual_potential_temperature
    read:
      covariance file path: testdata/MUstats.nc
  - saber block name: mo_hydrostatic_pressure_hydrostatic_exner_to_pressure_exner
  - saber block name: mo_air_temperature
    skip inverse test: true
  - saber block name: mo_moistincrop
    skip inverse test: true  # Tested within the mo_super_mio block
    moisture incrementing operator file: testdata/MIO_coefficients.nc
  - saber block name: mo_dry_air_density
    skip inverse test: true

# ↓↓↓ This is where to change ↓↓↓
# ------------------------------------------------------------------------------------
# A Dirac experiment injects a small impulse (like a unit perturbation) into a single 
# model variable at a specific grid location (longitude, latitude, vertical level). 
# The resulting model increment (after applying the background error covariance) shows 
# how that small perturbation spreads to other variables, levels, and grid points due 
# to correlations defined by the covariance model.
# ------------------------------------------------------------------------------------
dirac:
  lon:
  - 0.0
  lat:
  - 50.0  
  level:
  - 1    
  variable:
  - dimensionless_exner_function_levels_minus_one  # <= Choose a variable below
# - eastward_wind
# - northward_wind
# - air_potential_temperature
# - dry_air_density_levels_minus_one
# - cloud_ice_mixing_ratio_wrt_moist_air_and_condensed_water
# - cloud_liquid_water_mixing_ratio_wrt_moist_air_and_condensed_water
# - dimensionless_exner_function_levels_minus_one
# - water_vapor_mixing_ratio_wrt_moist_air_and_condensed_water
# ------------------------------------------------------------------------------------
# ↑↑↑ This is where to change ↑↑↑

background:
  date: 2016-01-01T16:00:00Z
  state variables:
  - air_potential_temperature  # for dry_air_density block
  - air_pressure  # for moistincrop block
  - air_pressure_levels_minus_one  # for dry_air_density block
  - cloud_ice_mixing_ratio_wrt_dry_air  # for dry_air_density block
  - cloud_liquid_water_mixing_ratio_wrt_dry_air  # for dry_air_density block
  - dimensionless_exner_function # for moisture_control block
  - dimensionless_exner_function_levels_minus_one  # for air_temperature block
  #  - dry_air_density_levels_minus_one  // calculated on fly
  - height_above_mean_sea_level  # state variable in quench only, for dry_air_density block
  - height_above_mean_sea_level_levels  # state variable in quench only, for dry_air_density block
  - ice_cloud_volume_fraction_in_atmosphere_layer  # for moistincrop block
  - liquid_cloud_volume_fraction_in_atmosphere_layer  # for moistincrop block
  - rain_mixing_ratio_wrt_dry_air  # for dry_air_density block
  - water_vapor_mixing_ratio_wrt_dry_air  # for dry_air_density block
  filepath: testdata/gauss_state

output dirac:
  # mpi pattern: '%MPI%'
  filepath: output